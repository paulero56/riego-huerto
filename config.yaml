# Configuración del sistema de riego
#
# Diseño: dos tinacos de 2000 L alimentados de la red municipal.
# Una válvula maestra controla la salida hacia el riego, y cinco
# válvulas de zona reparten el agua por secciones.
#
# Los pines usan numeración BCM (la del código), no la física del conector.

hardware:
  # true  = usa GPIO real (en la Raspberry Pi)
  # false = modo simulación, imprime en pantalla sin tocar hardware
  gpio_real: false

  # Los relés de disparo por nivel ALTO cierran el contacto con GPIO en HIGH.
  # Si tu módulo es de disparo por nivel BAJO, pon false.
  rele_activo_en_alto: true

pines:
  # Válvula maestra: va aguas arriba de las de zona.
  # Solo se abre durante el riego, así la línea principal no queda
  # presurizada las 24 horas. Si una zona gotea o se rompe un tubo,
  # la fuga dura minutos y no días.
  valvula_maestra: 17

  # Entrada: HIGH = hay agua en los tinacos
  flotador: 27

zonas:
  - nombre: "Sección 1 - Norte"
    pin: 22
    minutos: 15
  - nombre: "Sección 2 - Noreste"
    pin: 23
    minutos: 15
  - nombre: "Sección 3 - Centro"
    pin: 24
    minutos: 15
  - nombre: "Sección 4 - Suroeste"
    pin: 25
    minutos: 15
  - nombre: "Sección 5 - Sur"
    pin: 5
    minutos: 15

seguridad:
  # Segundos entre abrir la válvula de zona y abrir la maestra.
  # Evita presurizar contra un extremo cerrado.
  retardo_zona_maestra: 3

  # Segundos entre cerrar la maestra y cerrar la zona.
  # Deja que la línea se despresurice a través de la zona abierta,
  # lo que reduce el golpe de ariete.
  retardo_maestra_zona: 5

  # Tope duro por zona. Si la configuración pide más, el código lo limita.
  # Protege contra un error de dedo que vaciaría los tinacos.
  max_minutos_por_zona: 30

  # Aborta el riego si el flotador indica tinacos vacíos.
  # Cámbialo a true cuando instales el flotador.
  requiere_flotador: false

registro:
  archivo: "riego.log"
  nivel: "INFO"
